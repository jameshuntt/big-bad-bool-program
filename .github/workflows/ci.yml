# Checks every push and pull request: formatting, tests with and without the
# bowl feature, clippy with warnings denied both ways, and the docs with
# warnings denied. Tests also run on the oldest Rust this crate supports
# (rust-version in Cargo.toml) without features; the bowl feature needs 1.88,
# the rust-version of ob-serve-a-bowl. The tests include the compile-fail
# cases (tests/step03_compile_fail.rs), the core-1o fixtures
# (tests/step10_core1o.rs) and the klepto oracle (tests/step11_klepto.rs).
# Publishing is manual for now.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test on Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Dependency versions the oldest supported Rust can build
        # the runner's newest cargo writes a fresh Cargo.lock, picking for each dependency the newest version
        # whose rust-version this one meets
        if: matrix.rust != 'stable'
        run: CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable generate-lockfile
      - name: Test, no features
        run: cargo test
      - name: Test, all features
        if: matrix.rust == 'stable'
        run: cargo test --all-features
      - name: Run the examples
        if: matrix.rust == 'stable'
        run: cargo run --example thermostat && cargo run --example declarations

  lint:
    name: fmt, clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy, no features
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy, all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
