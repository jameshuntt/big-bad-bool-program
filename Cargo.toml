[package]
name = "big-bad-bool-program"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["James Hunt"]
description = "Programs over Big Bad Bool packed words: typed dimensions, declarative contracts across them, bounded verification, and deterministic stepping with one write path."
repository = "https://github.com/jameshuntt/big-bad-bool-program"
readme = "README.md"
keywords = ["bitpack", "bitfields", "contracts", "state-machine", "verification"]
categories = ["data-structures", "encoding"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Publishes step events to ob-serve-a-bowl as WakeKey64 packets.
bowl = ["dep:ob-serve-a-bowl"]

[dependencies]
big-bad-bool-core = "0.1.1"
big-bad-bool-interact = "0.1.0"
flaga_solver = "0.1.1"
liaise = "0.2.4"
stable_digest = "0.1.1"
ob-serve-a-bowl = { version = "0.2.2", optional = true }

[dev-dependencies]
big-bad-bool = "0.1.1"
# A shadow parser written as a program is compared with core-1o on its published fixtures.
core-1o = "0.2.0"
# klepto is the oracle for declarations and references in Rust;
# proc-macro2 tokenizes the same files for the stepper.
klepto = "0.3.5"
proc-macro2 = { version = "1", features = ["span-locations"] }

[lints.rust]
unsafe_code = "forbid"
